<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard | RigorWorks</title>
    <meta name="robots" content="noindex, nofollow">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">Admin Dashboard</h1>
            <button id="logout-btn" class="btn btn-outline-secondary btn-sm">Log Out</button>
        </div>

        <ul class="nav nav-tabs mb-3">
            <li class="nav-item">
                <button class="nav-link active" data-tab="leads">Contact Leads</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-tab="applicants">Career Applicants</button>
            </li>
        </ul>

        <div id="status" class="mb-3"></div>

        <div data-panel="leads" class="table-responsive">
            <table class="table table-bordered bg-white align-middle">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Company</th>
                        <th>Phone</th>
                        <th>Service</th>
                        <th>Message</th>
                    </tr>
                </thead>
                <tbody id="leads-body"></tbody>
            </table>
        </div>

        <div data-panel="applicants" class="table-responsive d-none">
            <table class="table table-bordered bg-white align-middle">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Note</th>
                        <th>Resume</th>
                    </tr>
                </thead>
                <tbody id="applicants-body"></tbody>
            </table>
        </div>

    </div>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/admin-dashboard.js"></script>

</body>

</html>
