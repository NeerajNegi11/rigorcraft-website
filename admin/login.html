<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login | RigorWorks</title>
    <meta name="robots" content="noindex, nofollow">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="bg-light">

    <div class="container d-flex align-items-center justify-content-center" style="min-height:100vh;">

        <div class="card p-4 shadow-sm" style="max-width:380px; width:100%;">

            <h1 class="h4 mb-3">Admin Login</h1>

            <form id="login-form">

                <input type="email" name="email" class="form-control mb-3" placeholder="Email" required>

                <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>

                <button type="submit" class="btn btn-primary w-100">Log In</button>

                <div data-form-status class="form-status"></div>

            </form>

        </div>

    </div>

    <script src="../assets/js/config.js"></script>
    <script>
        (function () {
            if (localStorage.getItem("rw_admin_token")) {
                window.location.href = "dashboard.html";
                return;
            }

            const form = document.getElementById("login-form");
            const statusEl = form.querySelector("[data-form-status]");

            form.addEventListener("submit", async function (event) {
                event.preventDefault();
                statusEl.textContent = "";
                statusEl.className = "form-status";

                try {
                    const response = await fetch(window.RIGORWORKS_API_BASE + "/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            email: form.email.value,
                            password: form.password.value,
                        }),
                    });

                    if (!response.ok) {
                        throw new Error("Invalid email or password");
                    }

                    const data = await response.json();
                    localStorage.setItem("rw_admin_token", data.token);
                    window.location.href = "dashboard.html";
                } catch (err) {
                    statusEl.textContent = err.message;
                    statusEl.className = "form-status form-status-error";
                }
            });
        })();
    </script>

</body>

</html>
